[package]
name = "time-mcp-server"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "A super basic MCP server that exposes current time information"
license = "MIT"
repository = "https://github.com/modpotatodotdev/time-mcp"

[dependencies]
rmcp = { version = "3.5", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = "0.4"
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
serde_json = "1"
