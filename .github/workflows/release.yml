name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)".*/\1/')
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Calculate next version
        id: bump_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"

          IFS='.' read -r -a PARTS <<< "$CURRENT"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}

          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag_version=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Next version: $NEW_VERSION"

      - name: Update version in Cargo.toml
        run: |
          NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          echo "Updated Cargo.toml to version $NEW_VERSION"

      - name: Update version references across the repo
        run: |
          NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
          TAG_VERSION="${{ steps.bump_version.outputs.tag_version }}"

          # Update any hardcoded version references in README / docs
          find . -type f \( -name "*.md" -o -name "*.rs" \) ! -path "./target/*" ! -path "./.git/*" | while read -r f; do
            # Package name references like time-mcp-server = "x.x.x"
            sed -i -E "s/(time-mcp-server[[:space:]]*=[[:space:]]*\")[^\"]+/\1$NEW_VERSION/g" "$f" 2>/dev/null || true
            # Version strings in docs
            sed -i -E "s/time-mcp-server-[0-9]+\.[0-9]+\.[0-9]+/time-mcp-server-$NEW_VERSION/g" "$f" 2>/dev/null || true
            # Tag references in URLs
            sed -i -E "s|(/releases/download/v)[0-9]+\.[0-9]+\.[0-9]+|\1$TAG_VERSION|g" "$f" 2>/dev/null || true
          done

          echo "Updated all version references to $NEW_VERSION"

      - name: Build
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --verbose

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add -A
          git commit -m "release: v${{ steps.bump_version.outputs.new_version }}"

      - name: Create and push tag
        run: |
          git tag -a ${{ steps.bump_version.outputs.tag_version }} -m "Release ${{ steps.bump_version.outputs.new_version }}"
          git push origin HEAD
          git push origin ${{ steps.bump_version.outputs.tag_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.tag_version }}
          name: Release ${{ steps.bump_version.outputs.new_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to crates.io
        run: cargo publish --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
